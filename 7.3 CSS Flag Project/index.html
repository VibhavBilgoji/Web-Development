<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      position: relative;
      height: 600px;
      width: 900px;
      background-color: #CE1126;
    }

    p{
      margin: 0%;
    }

    .flag > p{
      font-size: 80px;
      width: 100%;
      text-align: center;
      color: white;
    }

    .flag > div{
      background-color: #002868;
      position: absolute;
      top: 25%;
      height: 50%;
      width: 100%;
    }

    .flag > div > div{
      height: 200px;
      width: 200px;
      background-color: white;
      border-radius: 50%;
      position: relative;
      top: 50px;
      left: 350px;
    }

    .flag div p{
      text-align: center;
      font-size: 80px;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag"> <!-- full flag -->
    <p>The Flag</p>
    <div> <!-- blue rectangle -->
      <div> <!-- middle circle -->
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
